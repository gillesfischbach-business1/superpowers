<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diddeleng — build agents</title>
<style>
  :root {
    --bg: #0d1117; --panel: #151b23; --panel2: #1b232d; --line: #26303c;
    --ink: #e7edf3; --dim: #8b9aab; --steel: #6ea8c7; --rust: #c1763f;
    --ok: #58b368; --bad: #d9605a; --run: #d9a441; --idle: #556373;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #17222c 0%, var(--bg) 60%);
    color: var(--ink); font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    padding: 28px clamp(16px, 4vw, 48px) 64px;
  }
  a { color: var(--steel); }
  header { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .01em; font-weight: 650; }
  h1 span { color: var(--rust); }
  .sub { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .05s;
  }
  button:hover { border-color: var(--steel); }
  button:active { transform: translateY(1px); }
  button.primary { background: #1f3a4a; border-color: #2f5a72; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel);
    border-radius: 999px; padding: 6px 14px; font-size: 12.5px; color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .dot.running { background: var(--run); box-shadow: 0 0 0 4px rgba(217,164,65,.15); animation: pulse 1.4s infinite; }
  .dot.green { background: var(--ok); }
  .dot.red { background: var(--bad); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; margin-bottom: 26px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .stat small { color: var(--dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin: 0 0 12px; font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .agent { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--idle); border-radius: 10px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .agent.pending { border-left-color: var(--idle); }
  .agent.running { border-left-color: var(--run); background: #1a2129; }
  .agent.done { border-left-color: var(--ok); }
  .agent.failed { border-left-color: var(--bad); }
  .agent .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .agent h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .agent .role { color: var(--dim); font-size: 12px; }
  .agent p { margin: 0; color: #b9c6d3; font-size: 12.5px; min-height: 34px; }
  .agent .meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px; color: var(--dim); }
  .tag { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
  .tag.ok { color: var(--ok); border-color: #2c4534; }
  .tag.bad { color: var(--bad); border-color: #4a2d2c; }
  .tag.run { color: var(--run); border-color: #4a3d22; }
  details { margin-top: 2px; }
  summary { cursor: pointer; color: var(--dim); font-size: 12px; outline: none; }
  pre { margin: 8px 0 0; background: #0b0f14; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #a8b8c6; max-height: 160px; overflow: auto; white-space: pre-wrap; }
  .agent button.run { align-self: flex-start; padding: 5px 11px; font-size: 12px; }

  .console { margin-top: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .console .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel2); font-size: 12px; color: var(--dim); }
  #log { margin: 0; padding: 12px 14px; height: 300px; overflow: auto; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #9fb0be; white-space: pre-wrap; }
  #log .a { color: var(--steel); }
  #log .s { color: var(--ok); }
  #log .f { color: var(--bad); }
  footer { margin-top: 18px; color: var(--idle); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Diddeleng <span>build pipeline</span></h1>
    <div class="sub">Nine specialist agents build the Dudelange world, one gate at a time.</div>
  </div>
  <div class="controls">
    <span class="pill"><span class="dot" id="statusDot"></span><span id="statusText">conniving…</span></span>
    <button class="primary" id="runAll">Run full pipeline</button>
    <button id="runQa">QA + release</button>
    <button id="clearLog">Clear log</button>
    <a href="/"><button>← back to the game</button></a>
  </div>
</header>

<section class="stats" id="stats"></section>

<h2>Agents</h2>
<div class="grid" id="agents"></div>

<section class="console">
  <div class="bar">
    <span>live pipeline output</span>
    <span id="conn">SSE: connecting…</span>
  </div>
  <pre id="log"></pre>
</section>

<footer>
  <span>dashboard: <code>/agents</code></span>
  <span>api: <code>/api/agents/status</code> · <code>/api/agents/run</code> · <code>/api/agents/stream</code></span>
</footer>

<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

let state = { agents: [], running: false };

function statusClass(s) {
  return s === 'done' ? 'done' : s === 'failed' ? 'failed' : s === 'running' ? 'running' : 'pending';
}
function statusTag(a) {
  const s = a.status || 'pending';
  const cls = s === 'done' ? 'ok' : s === 'failed' ? 'bad' : s === 'running' ? 'run' : '';
  const label = s === 'done' ? 'green' : s;
  const dur = a.duration ? ` · ${(a.duration / 1000).toFixed(1)}s` : '';
  return `<span class="tag ${cls}">${label}${dur}</span>`;
}

let lastMeta = null;
function renderStats(meta) {
  if (meta) lastMeta = meta;
  meta = lastMeta;
  const agents = state.agents;
  const done = agents.filter((a) => a.status === 'done').length;
  const failed = agents.filter((a) => a.status === 'failed').length;
  const gates = agents.reduce((n, a) => n + (a.gates?.length || 0), 0);
  const cards = [
    [done + '/' + agents.length, 'stages green'],
    [failed, 'stages failed'],
    [gates, 'acceptance gates'],
    [meta?.stats?.buildings ?? '—', 'buildings'],
    [meta?.stats?.roads ?? '—', 'roads'],
    [meta?.stats?.doors ?? '—', 'entrances'],
    [typeof meta?.stats?.railKm === 'number' ? meta.stats.railKm.toFixed(2) : '—', 'rail km']
  ];
  $('#stats').innerHTML = cards.map(([v, l]) => `<div class="stat"><b>${esc(v)}</b><small>${esc(l)}</small></div>`).join('');
}

function renderAgents() {
  const el = $('#agents');
  el.innerHTML = state.agents.map((a) => {
    const log = (a.log || []).join('\n');
    return `<article class="agent ${statusClass(a.status)}">
      <div class="top">
        <div><h3>${esc(a.name)}</h3><div class="role">${esc(a.role || a.id)}</div></div>
        ${statusTag(a)}
      </div>
      <p>${esc(a.summary || '')}</p>
      <div class="meta">
        <span class="tag">${esc(a.script)}</span>
        <span class="tag">${(a.gates || []).length} gates</span>
        ${(a.outputs || []).slice(0, 2).map((o) => `<span class="tag">${esc(o)}</span>`).join('')}
      </div>
      <button class="run" data-agent="${esc(a.id)}" ${state.running ? 'disabled' : ''}>run stage</button>
      ${log ? `<details><summary>last output</summary><pre>${esc(log)}</pre></details>` : ''}
    </article>`;
  }).join('');
  el.querySelectorAll('button.run').forEach((b) => {
    b.addEventListener('click', () => run(b.dataset.agent));
  });
}

function renderStatus() {
  const dot = $('#statusDot');
  dot.className = 'dot ' + (state.running ? 'running' : state.agents.some((a) => a.status === 'failed') ? 'red' : 'green');
  $('#statusText').textContent = state.running
    ? 'pipeline running'
    : `${state.agents.filter((a) => a.status === 'done').length}/${state.agents.length} stages green`;
  $('#runAll').disabled = state.running;
  $('#runQa').disabled = state.running;
}

async function load() {
  try {
    const [s, m] = await Promise.all([
      fetch('/api/agents/status').then((r) => r.json()),
      fetch('/api/world/meta').then((r) => r.json())
    ]);
    state = { agents: s.agents, running: s.running };
    renderStats(m);
    renderAgents();
    renderStatus();
  } catch (e) {
    $('#statusText').textContent = 'server not reachable';
    $('#statusDot').className = 'dot red';
  }
}

async function run(scope) {
  const res = await fetch('/api/agents/run', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ agent: scope })
  }).catch(() => null);
  if (!res) return;
  if (res.status === 409) logLine('pipeline already running — wait for it to finish', 'f');
  if (res.ok) {
    state.running = true;
    renderStatus();
    renderAgents();
  }
}

function logLine(text, cls = '') {
  const log = $('#log');
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const span = document.createElement('div');
  if (cls) span.className = cls;
  span.textContent = text;
  log.appendChild(span);
  while (log.childElementCount > 600) log.firstElementChild.remove();
  if (nearBottom) log.scrollTop = log.scrollHeight;
}

$('#runAll').addEventListener('click', () => run('all'));
$('#runQa').addEventListener('click', () => run('qa'));
$('#clearLog').addEventListener('click', () => ($('#log').innerHTML = ''));

function connect() {
  const es = new EventSource('/api/agents/stream');
  $('#conn').textContent = 'SSE: live';
  es.addEventListener('state', (ev) => {
    try {
      const data = JSON.parse(ev.data);
      if (data.agents) {
        state.agents = data.agents;
        state.running = state.agents.some((a) => a.status === 'running');
        renderStats();
        renderAgents();
        renderStatus();
      }
    } catch (e) {}
  });
  es.onmessage = (ev) => {
    try {
      const data = JSON.parse(ev.data);
      if (data.type === 'log') {
        const cls = /✘|fail|GATE FAILED/i.test(data.text) ? 'f' : /✔|green|finished/i.test(data.text) ? 's' : /^\[/.test(data.text) ? 'a' : '';
        logLine(data.text, cls);
      }
    } catch (e) { logLine(ev.data); }
  };
  es.onerror = () => {
    $('#conn').textContent = 'SSE: reconnecting…';
    es.close();
    setTimeout(connect, 2500);
  };
}

load();
connect();
setInterval(() => { if (!state.running) load(); }, 15000);
</script>
</body>
</html>
